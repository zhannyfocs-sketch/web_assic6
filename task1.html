<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 1.</title>
    <link rel="stylesheet" href="css/task1.css">
</head>
<body>
    <header class="top">
        <h1>Task 1.</h1>
    </header>

    <main class="layout">
        <section class="house-section">
            <div class="house">
                <div class="roof"><span class="sign">The Party, 19:30 - 22:30</span></div>
                <div id="floors"></div>
                <div class="ground"></div>
            </div>

            <div class="legend">
                <span class="dots">
                    <i class="dot blue"></i>
                    <i class="dot red"></i>
                    <i class="dot green"></i>
                    <i class="dot black"></i>
                    <i class="dot yellow"></i>
                    <i class="dot purple"></i>
                </span> Clothing color
                <span>📱 Phone</span>
                <span>👓 Glasses</span>
                <span>👜 Bag</span>
                <span>🥤 Cup</span>
                <span>🍪 Cake crumbs</span>
                <span>🕒 Arrival time</span>
                <span><i class="badge-mini">🎓</i> AITU student</span>
            </div>
        </section>

        <section class="controls-section">
            <div id="result" class="result">
                <div class="result-title">Result</div>
                <div class="result-names">Click a case below to start.</div>
            </div>

            <h2 class="cases-title">Cases</h2>
            <div id="cases" class="cases"></div>
        </section>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/task1.js"></script>
</body>
</html>
